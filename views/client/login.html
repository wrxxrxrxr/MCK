<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в личный кабинет</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e31e24">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #e31e24;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .logo p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.2s;
        }
        
        input:focus {
            border-color: #e31e24;
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: #e31e24;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        
        button:hover {
            background: #c01016;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(227,30,36,0.2);
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .info a {
            color: #e31e24;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <h1>MCK-Reliable</h1>
            <p>Вход в личный кабинет клиента</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <form onsubmit="login(event)">
            <div class="form-group">
                <label>Email (логин)</label>
                <input type="email" id="email" placeholder="Введите ваш email" required>
            </div>
            
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль" required>
            </div>
            
            <button type="submit">Войти</button>
        </form>
        
        <div class="info">
            Данные для входа отправлены на почту после одобрения заявки
        </div>
    </div>
    
    <script>
        async function login(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            try {
                const response = await fetch('/api/client/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('clientToken', data.token);
                    window.location.href = '/client';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = data.error || 'Неверный email или пароль';
                }
            } catch (error) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Ошибка подключения к серверу';
            }
        }
    </script>
</body>
</html>
